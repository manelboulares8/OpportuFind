<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>JobEntry - Job Portal Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="../../assets/img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="../../assets/lib/animate/animate.min.css" rel="stylesheet">
    <link href="../../assets/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="container-xxl bg-white p-0">
      

        <!-- Navbar Start -->
        <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
            <a href="index.html" class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5">
                <h1 class="m-0 text-primary">Profil</h1>
            </a>
            <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto p-4 p-lg-0">
                    <a href="index.html" class="nav-item nav-link">Home</a>
                    <a href="about.html" class="nav-item nav-link">About</a>
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Jobs</a>
                        <div class="dropdown-menu rounded-0 m-0">
                            <a href="job-list.html" class="dropdown-item">Job List</a>
                            <a href="job-detail.html" class="dropdown-item">Job Detail</a>
                        </div>
                    </div>
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle active" data-bs-toggle="dropdown">Pages</a>
                        <div class="dropdown-menu rounded-0 m-0">
                            <a href="category.html" class="dropdown-item">Job Category</a>
                            <a href="testimonial.html" class="dropdown-item active">Testimonial</a>
                            <a href="404.html" class="dropdown-item">404</a>
                        </div>
                        
                    </div>
                    <a href="contact.html" class="nav-item nav-link">Contact</a>
                </div>
                <a href="logout.html" class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block">Se déconnecter<i class="fa fa-sign-out-alt ms-3"></i></a>            </div>
        </nav>
        <!-- Navbar End -->
<div class="container rounded bg-white mt-5 mb-5">
    <div class="row">
        <div class="col-md-3 border-right">
            <div class="d-flex flex-column align-items-center text-center p-3 py-5"><img class="rounded-circle mt-5" width="150px" src="https://st3.depositphotos.com/15648834/17930/v/600/depositphotos_179308454-stock-illustration-unknown-person-silhouette-glasses-profile.jpg"><label class="font-weight-bold" ><b>{{ user.fullName }}</b></label><label class="text-black-50" >{{ user.email }}</label></div>
        </div>
        <div class="col-md-5 border-right">
            <div class="p-3 py-5">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-right">Mon profil</h4>
                </div>
                <form (ngSubmit)="updateProfile()">
                <div class="row mt-2">
                    <div class="col-md-6"><label class="labels">Nom</label><input type="text" class="form-control" [(ngModel)]="user.fullName" name="fullName"></div>
                    <div class="col-md-6"><label class="labels">Email</label><input type="email" class="form-control"  [(ngModel)]="user.email" name="email"></div>
                </div>
                <div *ngIf="userRole === 'entrepreneur'">
                <div class="row mt-3">
                    <div class="col-md-12"><label class="labels">Localisation</label><input type="text" class="form-control" [(ngModel)]="user.localisation" name="localisation"></div>
                    <div class="col-md-12"><label class="labels">Secteur</label><input type="text" class="form-control"  [(ngModel)]="user.secteur" name="secteur"></div>
                    <div class="col-md-12"><label class="labels">A propos </label><textarea type="text" class="form-control" rows="3" [(ngModel)]="user.aboutUs" name="aboutUs"></textarea></div>
                    
                </div>
                </div>
                  <!-- Formulaire spécifique à l'étudiant -->
                <div *ngIf="userRole === 'etudiant'">
                <div class="row mt-3">
                    <div class="col-md-6"><label class="labels">Université</label><input type="text" class="form-control" [(ngModel)]="user.university" name="university"></div>
                    <div class="col-md-6"><label class="labels">Parcours</label><input type="text" class="form-control" [(ngModel)]="user.parcours" name="parcours"></div>
                    <div class="col-md-6"><label class="labels">Lien du CV</label><input type="text" class="form-control" [(ngModel)]="user.cvUrl" name="cvUrl"></div>

                </div>
                </div>
                <div class="mt-5 text-center"><button class="btn btn-primary profile-button" type="submit">Mettre à jour</button></div>
                </form>
                
            </div>
        </div>
       
    </div>
</div>
