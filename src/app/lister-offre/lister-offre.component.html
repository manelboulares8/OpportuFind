<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>OpportuFind</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="../../assets/img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="../../assets/lib/animate/animate.min.css" rel="stylesheet">
    <link href="../../assets/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="container-xxl bg-white p-0">
       
<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
    <a href="index.html" class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5">
        <h1 class="m-0 text-primary">OpportuFind</h1>
    </a>
    <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
        <div class="navbar-nav ms-auto p-4 p-lg-0">
            <button (click)="goToHome()" class="nav-item nav-link">Home</button>

            <a href="/about" class="nav-item nav-link">About</a>

            <!-- Condition pour afficher le lien "Publier une offre" pour les entrepreneurs -->


            <!-- Dropdown pour Opportunités -->
            <div class="nav-item dropdown">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Opportunités</a>
                <div class="dropdown-menu rounded-0 m-0">
                    
                    <div *ngIf="userRole === 'etudiant'">
                        <button (click)="goToListerCandidaturesetu()" class="dropdown-item">Lister mes Candidatures</button>
                        <button (click)="goToJobList()" class="dropdown-item">Liste des stages disponibles</button>


                    </div>
                    <div *ngIf="userRole === 'entrepreneur'">
                        <button (click)="goToListerCandidatures()" class="dropdown-item">Lister Candidatures reçues</button>
                    <button (click)="goToListerMesOffres()" class="dropdown-item">Lister Mes Offres</button>
                        <button (click)="goToAdd()" class="dropdown-item">Publier une offre</button>
                    </div>
                    <button (click)="goToJobDetail()" class="dropdown-item">Détails</button>
                    
             
        
                </div>
            </div>

            <!-- Dropdown pour Pages -->
            <div class="nav-item dropdown">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a>
                <div class="dropdown-menu rounded-0 m-0">
                    <button (click)="goToCategory()" class="dropdown-item">Job Category</button>
                    <button (click)="goToTestimonial()" class="dropdown-item">Testimonial</button>
                    <button (click)="goTo404()" class="dropdown-item">404</button>
                </div>
            </div>

            <button (click)="goToContact()" class="nav-item nav-link">Contact</button>
            <button (click)="goToProfile()" class="nav-item nav-link">Profil</button>

        </div>

        <button (click)="goToLogout()" class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block">
            Se déconnecter<i class="fa fa-sign-out-alt ms-3"></i>
        </button>
    </div>
</nav>
<!-- Navbar End -->


        <!-- Header End -->
        <div class="container-xxl py-5 bg-dark page-header mb-5">
            <div class="container my-5 pt-5 pb-4">
                <h1 class="display-3 text-white mb-3 animated slideInDown">Mes offres</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb text-uppercase">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item"><a href="#">Pages</a></li>
                        <li class="breadcrumb-item text-white active" aria-current="page">Mes offres</li>
                    </ol>
                </nav>
            </div>
        </div>
        <!-- Header End -->

<!-- Full Screen Search Start -->
<div class="modal fade" id="searchModal" tabindex="-1">
  <div class="modal-dialog modal-fullscreen">
      <div class="modal-content" style="background: rgba(9, 30, 62, .7);">
          <div class="modal-header border-0">
              <button type="button" class="btn bg-white btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex align-items-center justify-content-center">
              <div class="input-group" style="max-width: 600px;">
                  <input type="text" class="form-control bg-transparent border-primary p-3" placeholder="Type search keyword">
                  <button class="btn btn-primary px-4"><i class="bi bi-search"></i></button>
              </div>
          </div>
      </div>
  </div>
</div>
<!-- Full Screen Search End -->

<div class="container">
<div class="row">
  <!-- Champ de filtre -->
  <div class="col-12 mb-3">
    <input type="text" id="searchInput" class="form-control" placeholder="Rechercher des offres d'emploi" oninput="applyFilter(event)">
  </div>
</div>

<!-- Tableau des offres -->
<div class="table-responsive">
  <table class="table table-striped">
    <thead>
   
      <tr>
        <th>Id</th>
        <th>Titre</th>
        <th>Localisation</th>
        <th>Exigences</th>
        <th>Description</th>
        <th>Date</th>

        <th>Action</th>
      </tr>
    </thead>
   <tbody *ngFor="let offre of offres">
      <tr>
        <td>{{offre.idOffre}}</td>
        <td>{{offre.titre}}</td>
        <td>{{offre.localisation}}</td>
        <td>{{offre.exigences}}</td>
        <td>{{offre.description}}</td>
        <td>{{offre.date}}</td>
        <td><a class="btn btn-danger" (click)="supprimerOffre(offre)">Supprimer</a></td>
        <td><a class="btn btn-success" (click)="ModifierOffre(offre.idOffre)">Modifier</a></td>
      </tr>
    </tbody>
   
  </table>
</div>
</div>
</div>

<!-- Ajout de jQuery, Popper.js et Bootstrap JS dans le bon ordre -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script> <!-- jQuery complet -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script> <!-- Popper.js -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> <!-- Bootstrap JS -->
</body>
</html>
