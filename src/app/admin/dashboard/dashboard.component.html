<!-- dashboard.component.html -->
<div class="container-fluid p-4">
  <!-- Page Header -->
  <h1 class="h3 mb-4 text-gray-800">Admin Dashboard</h1>

  <!-- Stats Cards Row -->
  <div class="row mb-4">
    <div class="col-xl-3 col-md-6 mb-4" *ngFor="let stat of stats | keyvalue">
      <div class="card border-left-primary shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                {{ stat.key | titlecase }}
              </div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">
                {{ stat.value }}
              </div>
            </div>
            <div class="col-auto">
              <i class="bi bi-calendar-check fs-2 text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts Row 1 -->
  <div class="row mb-4">
    <!-- Status Pie Chart -->
    <div class="col-xl-4 col-lg-5">
      <div class="card shadow">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Candidature Status</h6>
        </div>
        <div class="card-body">
          <div style="height: 300px">
            <canvas baseChart 
              [data]="statusChart" 
              [type]="'pie'"
              [options]="pieOptions">
            </canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Secteur Bar Chart -->
    <div class="col-xl-8 col-lg-7">
      <div class="card shadow">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Candidatures par Secteur</h6>
        </div>
        <div class="card-body">
          <div style="height: 300px">
            <canvas baseChart 
              [data]="secteurChart" 
              [type]="'bar'"
              [options]="barOptions">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Trend Line Chart -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Recruitment Trend</h6>
        </div>
        <div class="card-body">
          <div style="height: 300px">
            <canvas baseChart 
              [data]="trendChart" 
              [type]="'line'"
              [options]="lineOptions">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<!-- Ajout de jQuery, Popper.js et Bootstrap JS dans le bon ordre -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script> <!-- jQuery complet -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script> <!-- Popper.js -->
